<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expression Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-top: 50px;
        }
        .container {
            width: 80%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            margin-top: 30px;
        }
        .result {
            text-align: center;
            margin-bottom: 20px;
        }
        .image-preview {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            font-size: 16px;
            color: #4CAF50;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .error-message {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Detected Expression: 
        <span class="{{ 'error-message' if expression == 'No face detected' else '' }}">{{ expression }}</span>
    </h1>
    <div class="container">
        <div class="result">
            <!-- Display the uploaded image with the source pointing to the uploaded file -->
            <img src="{{ url_for('static', filename='uploads/' + image_filename) }}" alt="Uploaded Image" class="image-preview">
            <p>Expression Detected: <strong class="{{ 'error-message' if expression == 'No face detected' else '' }}">{{ expression }}</strong></p>
        </div>
        <a href="http://127.0.0.1:5000/" class="back-link">Upload another image</a>
    </div>
</body>
</html>
