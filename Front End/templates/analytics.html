<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conduct Interface</title>
    <link rel="stylesheet" href="../static/analytics.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* CSS for modal */
        #confirmationModal {
            display: none; /* Initially hidden */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            text-align: center;
        }
        .modal-content p {
            margin-bottom: 20px;
        }
        .modal-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .modal-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .modal-buttons button:first-child {
            background-color: #d33;
            color: #fff;
        }
        .modal-buttons button:last-child {
            background-color: #007bff;
            color: #fff;
        }
        /* Style for "Not Interested" text */
        #not-interest-percentage.red {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
            <video id="backgroundVideo" autoplay muted loop>
                <source src="../static/images/educational_video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <div id="controls">
            <button id="muteButton">Mute</button>
            <button id="videoButton">Disable Video</button>
            <button id="shareScreenButton">Share Screen</button>
            <button id="participantsButton">Participants</button>
            <button id="chatButton">Chat</button>
            <button id="leaveButton">End</button>
            <button id="activityButton" onclick="startActivity()">Activity</button>
            <!-- <div class="dropup">
                <button id="activityButton">Activity</button>
                <div class="dropup-content">
                    <a href="http://localhost/codeWarriors/templates/questions.php?type=MCQ" id="mcqOption">MCQ</a>
                    <a href="http://localhost/CodeWarriors/templates/questions.php?type=Yes/No" id="yesNo">Yes / NO</a>
                    <a href="http://localhost/CodeWarriors/templates/questions.php?type=Short%20Answ" id="shortAnswerOption">Short Answers</a>
                </div>
            </div> -->
        </div>
    </div>

    <div class="sidebar">
        <div class="resizer"></div>
        <div id="participantsList" class="sidebar-section">
            <h2>Participants</h2>
            <ul id="participants"></ul>
        </div>
        <div id="chatArea" class="sidebar-section">
            <h2>Chat</h2>
            <div id="messages"></div>
            <input type="text" id="chatInput" placeholder="Type a message...">
            <button id="sendMessageButton">Send</button>
        </div>
        <div id="analyticsArea" class="sidebar-section">
            <button type="submit" id="generateButton">Generate Live Analytics</button>
            <button type="submit" id="downloadButton">Download Attendence</button>
            <h1>Analytics</h1>
            <div class="analytics-container">
                <!-- Count Section -->
                <div class="analytics-section" id="count-section">
                    <h2>Counts</h2>
                    <p>Interested: <span id="interested-count">0</span></p>
                    <p>Not Interested: <span id="not-interest-count">0</span></p>
                </div>

                <!-- Percentage Section -->
                <div class="analytics-section" id="percentage-section">
                    <h2>Percentage</h2>
                    <p>Interested: <span id="interested-percentage">0</span>%</p>
                    <p>Not Interested: <span id="not-interest-percentage" class="not-interest-percentage">0</span>%</p>
                </div>

                <!-- Line Graph Section -->
                <div class="analytics-section">
                    <h2>Engagement Levels</h2>
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="../static/server.js"></script>
    <script>
        // Store historical data for the line chart
        const interestedData = [];
        const notInterestedData = [];
        const timestamps = [];

        // Function to fetch and display analytics data
        async function fetchAnalytics() {
            const response = await fetch('/analytics_data');
            const data = await response.json();
            
            // Display counts
            document.getElementById('interested-count').textContent = data.interested_count;
            document.getElementById('not-interest-count').textContent = data.not_interest_count;

            // Calculate and display percentages
            const total = data.interested_count + data.not_interest_count;
            const interestedPercentage = ((data.interested_count / total) * 100).toFixed(2);
            const notInterestedPercentage = ((data.not_interest_count / total) * 100).toFixed(2);
            document.getElementById('interested-percentage').textContent = interestedPercentage;
            const notInterestedPercentageElement = document.getElementById('not-interest-percentage');

            // Set "Not Interested" percentage and change color if 50% or above
            notInterestedPercentageElement.textContent = notInterestedPercentage;
            if (notInterestedPercentage >= 50) {
                notInterestedPercentageElement.classList.add('red');
            } else {
                notInterestedPercentageElement.classList.remove('red');
            }

            // Update line chart data
            const now = new Date().toLocaleTimeString();
            interestedData.push(data.interested_count);
            notInterestedData.push(data.not_interest_count);
            timestamps.push(now);

            // Keep only recent data points
            if (timestamps.length > 10) {
                interestedData.shift();
                notInterestedData.shift();
                timestamps.shift();
            }
            
            // Update the chart with new data
            lineChart.data.labels = timestamps;
            lineChart.data.datasets[0].data = interestedData;
            lineChart.data.datasets[1].data = notInterestedData;
            lineChart.update();
        }

        // Initialize the line chart
        const ctx = document.getElementById('lineChart').getContext('2d');
        const lineChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: timestamps,
                datasets: [
                    {
                        label: 'Interested',
                        data: interestedData,
                        borderColor: 'rgba(75, 192, 192, 1)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        fill: false,
                        lineTension: 0.3
                    },
                    {
                        label: 'Not Interested',
                        data: notInterestedData,
                        borderColor: 'rgba(255, 99, 132, 1)',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        fill: false,
                        lineTension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // Fetch analytics data every 5 seconds
        setInterval(fetchAnalytics, 5000);

        document.getElementById('leaveButton').addEventListener('click', function() {
            if (confirm("Are you sure you want to leave?")) {
                window.location.href = 'http://127.0.0.1/CodeWarriors/templates/conduct_session.html';
            }
        });

        /* document.getElementById('activityButton').addEventListener('click', function() {
                window.location.href = 'http://localhost/CodeWarriors/templates/activity.php';
        }); */

        document.getElementById('generateButton').addEventListener('click', function() {
            window.location.href = 'http://127.0.0.1:5000/analytics';
        });

        document.getElementById('downloadButton').addEventListener('click', function() {
            window.location.href = 'http://127.0.0.1/CodeWarriors/templates/attendence.php';
        });
    </script>
    <script>
        // Insert this script at the bottom of the lecturer's dashboard page or in a separate JS file linked to the page
        function startActivity() {
            // Broadcast an event using localStorage
            localStorage.setItem('startActivity', JSON.stringify({
                timestamp: Date.now(), // Add a timestamp to ensure the event is detected
                message: "Start activity"
            }));
        }

        // Global JavaScript (shared.js or included in all pages)
        const channel = new BroadcastChannel('activity_channel');

        // For lecturer or student: Handle received messages
        channel.onmessage = function (event) {
            console.log("Received message:", event.data);
            // Handle logic based on the page type (lecturer or student)
        };
    </script>
</body>
</html>
