<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conduct Sessions</title>
    <link rel="stylesheet" href="../static/conduct_sessions.css">
    <style>
        .profile {
            position: relative;
            display: inline-block;
        }

        .profile-dropdown {
            display: none;
            position: absolute;
            right: 0;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .profile-dropdown a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .profile-dropdown a:hover {
            background-color: #f1f1f1;
        }

        .profile:hover .profile-dropdown {
            display: block;
        }

        .session-item {
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .buttons-container {
            display: flex;
            gap: 10px;
        }

        .active-button, .inactive-button {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
            color: #fff;
        }

        .active-button {
            background-color: #074f61; /* Green for Active */
        }

        .inactive-button {
            background-color: #f44336; /* Red for Inactive */
        }

        .active-button:hover, .inactive-button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="notification">
            <img src="../static/images/logo.png" alt="Logo" height="50px" width="85px">
        </div>
        <ul class="nav-links">
            <li><a href="create_session.html" class="nav-link">Create Session</a></li>
            <li class="active"><a href="#" class="nav-link">Conduct Session</a></li>
            <li><a href="manage_activities.html" class="nav-link">Manage Activities</a></li>
        </ul>
        <div class="nav-right">
            <div class="notification">
                <img src="../static/images/notification.png" alt="Notifications">
            </div>
            <div class="profile">
                <img id="profileIcon" src="images/profile.png" alt="Profile">
                <div class="profile-dropdown">
                    <a href="edit_profilee.php">Edit Profile</a>
                    <a href="change_password.html">Change Password</a>
                    <a id="logoutBtn" href="lec_login.html">Logout</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="content">
        <ul id="session-list"></ul>
    </div>

    <script>
        function showSessionDetails(sessionId) {
            alert("You selected the session with the Session ID " + sessionId);
            window.location.href = `http://127.0.0.1:5000/analytics?sessionId=${sessionId}`;
        }

        function updateSessionStatus(sessionId, status) {
            // Make an API call to update the session status
            fetch(`update_status.php?sessionId=${sessionId}&status=${status}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `sessionId=${sessionId}&status=${status}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(`Session status updated to ${status}`);
                    location.reload(); // Reload to reflect changes
                } else {
                    alert('Failed to update session status.');
                }
            })
            .catch(error => console.error('Error updating session status:', error));
        }

        document.addEventListener('DOMContentLoaded', () => {
    fetch('sessions.php')
        .then(response => response.json())
        .then(data => {
            const sessionList = document.getElementById('session-list');
            sessionList.innerHTML = '';

            data.forEach(session => {
                const listItem = document.createElement('li');
                listItem.className = 'session-item';

                const sessionDiv = document.createElement('div');
                sessionDiv.className = 'session-link';

                // Add details to sessionDiv
                sessionDiv.innerHTML = `
                    <div class="session-header">${session.topic}</div>
                    <div class="session-detail">ID: ${session.sessionid}</div>
                    <div class="session-detail">Passcode: ${session.passcode}</div>
                    <div class="session-detail">Course Code: ${session.coursecode}</div>
                    <div class="session-detail">Start Time: ${session.starttime}</div>
                    <div class="session-detail">End Time: ${session.endtime}</div>
                    <div class="session-detail">Duration: ${session.duration}</div>
                    <div class="session-detail">Date: ${session.date}</div>
                    <div class="session-detail">Status: ${session.status}</div>
                `;

                // Add event listener to redirect when clicking on session details
                sessionDiv.addEventListener('click', () => {
                    alert("You selected the session with the Session ID " + session.sessionid);
                    window.location.href = `http://127.0.0.1:5000/analytics?sessionId=${session.sessionid}`;
                });

                // Buttons Container
                const buttonsContainer = document.createElement('div');
                buttonsContainer.className = 'buttons-container';

                // Active Button
                const activeButton = document.createElement('button');
                activeButton.textContent = 'Active';
                activeButton.className = 'active-button';
                activeButton.addEventListener('click', (event) => {
                    event.stopPropagation(); // Prevent triggering the sessionDiv click
                    updateSessionStatus(session.sessionid, 'active');
                });

                // Inactive Button
                const inactiveButton = document.createElement('button');
                inactiveButton.textContent = 'Inactive';
                inactiveButton.className = 'inactive-button';
                inactiveButton.addEventListener('click', (event) => {
                    event.stopPropagation(); // Prevent triggering the sessionDiv click
                    updateSessionStatus(session.sessionid, 'inactive');
                });

                // Append buttons to the container
                buttonsContainer.appendChild(activeButton);
                buttonsContainer.appendChild(inactiveButton);

                // Append session details and buttons to list item
                listItem.appendChild(sessionDiv);
                listItem.appendChild(buttonsContainer);

                // Append list item to session list
                sessionList.appendChild(listItem);
            });
        })
        .catch(error => console.error('Error fetching session details:', error));
});
    </script>

    <script src="../static/update_status.js"></script>
</body>
</html>
