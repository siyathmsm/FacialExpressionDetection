    <script>
        // Add click event to profile icon to toggle dropdown(newly added)
        const profileIcon = document.getElementById('profileIcon');
        const profileDropdown = document.querySelector('.profile-dropdown');

        profileIcon.addEventListener('click', (event) => {
            // Toggle the display of the dropdown
            if (profileDropdown.style.display === 'block') {
                profileDropdown.style.display = 'none';
            } else {
                profileDropdown.style.display = 'block';
            }
        });

        // Close dropdown if user clicks outside of it(newly added)
        window.addEventListener('click', function(event) {
            if (!profileIcon.contains(event.target) && !profileDropdown.contains(event.target)) {
                profileDropdown.style.display = 'none'; // Close dropdown
            }
        });

        // Logout confirmation script(newly added)
        document.getElementById('logoutBtn').addEventListener('click', function(event) {
            event.preventDefault(); // Prevent the default action
            const userConfirmed = confirm("Are you sure you want to logout?");
            if (userConfirmed) {
                window.location.href = 'lec_login.html'; // Redirect to the logout URL if user confirms
            }
        });

        // Listen for custom event to update profile picture(newly added)
        window.addEventListener('updateProfilePicture', function(event) {
            var newProfilePicture = event.detail.newProfilePicture;
            document.getElementById('profileIcon').src = newProfilePicture;
        });
    </script>
