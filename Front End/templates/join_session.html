<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Session</title>
    <link rel="stylesheet" href="../static/join_session.css">
    <link rel="stylesheet" href="../static/lec_login_2.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* Navbar styles */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #77B0AA;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        /* Left section of navbar (logo + user info) */
        .nav-left {
            display: flex;
            align-items: center;
        }

        /* Logo styling */
        .navbar .logo img {
            height: 50px;
            width: 85px;
            margin-right: 20px; /* Space between logo and user info */
        }

        /* User info section */
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px; /* Add spacing between items */
            font-size: 18px;
            line-height: 1.5;
        }

        .user-info span {
            position: relative;
            font-weight: bold;
            color: #333;
        }

        /* Add a dot after each span except the last one */
        .user-info span::after {
            content: "|";
            position: absolute;
            right: -10px; /* Adjust spacing between the text and the dot */
            color: #333;
            font-weight: normal;
        }

        /* Remove the dot from the last span */
        .user-info span:last-child::after {
            content: "";
        }

        .progress-bar-container {
            width: 150px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 20px;
            background-color: #4caf50;
            text-align: center;
            color: white;
            line-height: 20px;
            width: 0%;
        }

        /* Profile icon styling */
        .profile {
            position: relative;
            margin-right: 15px;
        }

        .profile img {
            width: 40px;
            height: 40px;
            cursor: pointer;
        }

        .profile-dropdown {
            display: none;
            position: absolute;
            right: 0;
            background-color: #f9f9f9;
            min-width: 164px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .profile-dropdown a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .profile-dropdown a:hover {
            background-color: #f1f1f1;
        }

        .profile:hover .profile-dropdown {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">
                <img src="../static/images/logo.png" alt="Logo">
            </div>
            <div class="user-info">
                <span id="user-firstname">Name: </span>
                <span id="user-email">Email: </span>
                <span id="user-score">Score: </span>
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>
        </div>
        <div class="nav-right">
            <div class="profile">
                <img id="profileIcon" src="../static/images/profile.png" alt="Profile">
                <div class="profile-dropdown">
                    <a href="edit_profilee.php">Edit Profile</a>
                    <a href="change_password.html">Change Password</a>
                    <a id="logoutBtn" href="lec_login.html">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2>Join a Session</h2>
        <form id="loginForm" action="join_session.php" method="post">
            <label for="sessionid">Session ID:</label>
            <input type="text" id="sessionid" name="sessionid" required>
            <label for="passcode">Passcode:</label>
            <input type="password" id="passcode" name="passcode" required>
            <input type="hidden" id="userEmail" name="email">
            <input type="hidden" id="userFirstName" name="firstname">
            <input type="hidden" id="userScore" name="score">
            <button type="submit" id="startButton">Join Session</button>
        </form>

        <div id="messageTab" class="hidden">
            <div class="message-content">
                <img id="messageImage" src="" alt="Message Image" class="message-image">
                <h2 id="messageHeading"></h2>
                <span id="messageText"></span>
                <button id="messageButton">OK</button>
            </div>
        </div>
    </div>

    <!-- <script src="../static/join_session.js"></script> -->
    <script>
                document.getElementById('loginForm').addEventListener('submit', function(event) {
                event.preventDefault();

                var formData = new FormData(this);

                fetch('join_session.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    showMessage(data.message, data.status === 'success');
                })
                .catch(error => console.error('Error:', error));
            });

            function showMessage(message, isSuccess) {
                var messageTab = document.getElementById('messageTab');
                var messageImage = document.getElementById('messageImage');
                var messageHeading = document.getElementById('messageHeading');
                var messageText = document.getElementById('messageText');
                var messageButton = document.getElementById('messageButton');

                messageText.textContent = message;
                messageTab.classList.remove('hidden');

                if (isSuccess) {
                    messageHeading.textContent = "Success";
                    messageImage.src = "images/success.png"; // Add a path to your success image
                    messageButton.className = "success";
                } else {
                    messageHeading.textContent = "Error";
                    messageImage.src = "images/error.png"; // Add a path to your error image
                    messageButton.className = "error";
                }

                messageButton.onclick = function() {
                    messageTab.classList.add('hidden');
                    if (isSuccess) {
                        // Redirect dynamically using the current origin and path
                        window.location.href = 'http://127.0.0.1:5000/student_interface';
                    }
                };
                
            }
    </script>
    <script>
        // Add click event to profile icon to toggle dropdown
        const profileIcon = document.getElementById('profileIcon');
        const profileDropdown = document.querySelector('.profile-dropdown');

        profileIcon.addEventListener('click', (event) => {
            profileDropdown.style.display = (profileDropdown.style.display === 'block') ? 'none' : 'block';
        });

        // Close dropdown if user clicks outside of it
        window.addEventListener('click', function(event) {
            if (!profileIcon.contains(event.target) && !profileDropdown.contains(event.target)) {
                profileDropdown.style.display = 'none'; // Close dropdown
            }
        });

        // Fetch session data
        fetch("session_data.php")
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                console.error(data.error);
            } else {
                // Display email, name, and score
                document.getElementById("user-firstname").textContent = `Name: ${data.firstname}`;
                document.getElementById("user-email").textContent = `Email: ${data.email}`;
                document.getElementById("user-score").textContent = `Score: ${data.score}`;

                document.getElementById("userEmail").value = data.email;
                document.getElementById("userFirstName").value = data.firstname;
                document.getElementById("userScore").value = data.score;

                // Update progress bar
                const score = data.score;
                const progressBar = document.getElementById("progress-bar");
                progressBar.style.width = `${score}%`;
                progressBar.textContent = `${score}%`;
            }
        })
        .catch(error => {
            console.error("Error fetching session data:", error);
        });
    </script>
    
</body>
</html>
