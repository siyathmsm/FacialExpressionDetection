<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conduct Interface</title>
    <link rel="stylesheet" href="../static/student_interface.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* Navbar styles */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #77B0AA;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        /* Left section of navbar (logo + user info) */
        .nav-left {
            display: flex;
            align-items: center;
        }

        /* Logo styling */
        .navbar .logo img {
            height: 50px;
            width: 85px;
            margin-right: 20px; /* Space between logo and user info */
        }

        /* User info section */
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px; /* Add spacing between items */
            font-size: 18px;
            line-height: 1.5;
        }

        .user-info span {
            position: relative;
            font-weight: bold;
            color: #333;
        }

        /* Add a dot after each span except the last one */
        .user-info span::after {
            content: "|";
            position: absolute;
            right: -10px; /* Adjust spacing between the text and the dot */
            color: #333;
            font-weight: normal;
        }

        /* Remove the dot from the last span */
        .user-info span:last-child::after {
            content: "";
        }
        
        .progress-bar-container {
            width: 150px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 20px;
            background-color: #4caf50;
            text-align: center;
            color: white;
            line-height: 20px;
            width: 0%;
        }

        /* Profile icon styling */
        .profile {
            position: relative;
            margin-right: 15px;
        }

        .profile img {
            width: 40px;
            height: 40px;
            cursor: pointer;
        }

        .profile-dropdown {
            display: none;
            position: absolute;
            right: 0;
            background-color: #f9f9f9;
            min-width: 164px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .profile-dropdown a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .profile-dropdown a:hover {
            background-color: #f1f1f1;
        }

        .profile:hover .profile-dropdown {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">
                <img src="../static/images/logo.png" alt="Logo">
            </div>
            <div class="user-info">
                <span id="user-firstname">Name: </span>
                <span id="user-email">Email: </span>
                <span id="user-score">Score: </span>
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>
        </div>
        <div class="nav-right">
            <div class="profile">
                <img id="profileIcon" src="../static/images/profile.png" alt="Profile">
                <div class="profile-dropdown">
                    <a href="edit_profilee.php">Edit Profile</a>
                    <a href="change_password.html">Change Password</a>
                    <a id="logoutBtn" href="lec_login.html">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <h1>Session Monitoring</h1>
    <div class="container">
        <div class="main-content">
            <video id="localVideo" width="640" height="480" autoplay></video>
        </div>
        <div id="controls">
            <button id="muteButton">Mute</button>
            <button id="videoButton">Disable Video</button>
            <button id="shareScreenButton">Share Screen</button>
            <button id="participantsButton">Participants</button>
            <button id="chatButton">Chat</button>
            <button id="leaveButton">Leave</button>
        </div>
    </div>
    
    <div class="sidebar" id="sidebar">
        <div class="resizer"></div>
        <div id="participantsList" class="participants-section">
            <h3>Participants</h3>
            <ul id="participants"></ul>
        </div>
        <div id="chatArea" class="chat-section">
            <h3>Chat</h3>
            <div id="messages"></div>
            <input type="text" id="chatInput" placeholder="Type a message...">
            <button id="sendMessageButton">Send</button>
        </div>
    </div>
    
    <script src="../static/student_interface.js"></script>
    <script src="../static/video_monitor.js"></script>
    <script>
        function captureImage() {
            const video = document.getElementById('localVideo');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataURL = canvas.toDataURL('image/png');
            return dataURL;
        }

        function sendImage() {
            const image = captureImage();
            fetch('/process_image', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ image: image }),
            })
            .then(response => response.json())
            .then(data => {
                console.log('Success:', data);
            })
            .catch((error) => {
                console.error('Error:', error);
            });
        }

        function startCapture() {
            setInterval(sendImage, 20000); // Capture and send image every 20 seconds
        }

        document.addEventListener('DOMContentLoaded', (event) => {
            const constraints = { video: true };
            const video = document.getElementById('localVideo');
            navigator.mediaDevices.getUserMedia(constraints)
                .then((stream) => {
                    video.srcObject = stream;
                    video.play();
                });

            startCapture();
        });
    </script>
    <script>
        document.getElementById('leaveButton').addEventListener('click', () => {
            if (confirm('Are you sure you want to leave the session?')) {
                // Add the logic for leaving the session here
                window.location.href = 'http://127.0.0.1/CodeWarriors/templates/join_session.html';
            }
        });
    </script>
    <script>
        // Listen for localStorage events
        window.addEventListener('storage', function(event) {
            if (event.key === 'startActivity') {
                const data = JSON.parse(event.newValue);
                if (data && data.message === "Start activity") {
                    // Redirect to the activity page
                    window.location.href = "http://127.0.0.1/CodeWarriors/templates/activity.php";
                }
            }
        });

        // Fetch data from session_data.php
        fetch('http://127.0.0.1/codeWarriors/templates/get_session_data.php', {
            credentials: 'include'
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json(); // Assuming session_data.php returns JSON
            })
            .then(data => {
                // Update the DOM with the fetched data
                document.getElementById("user-firstname").textContent = `Name: ${data.firstname}`;
                document.getElementById("user-email").textContent = `Email: ${data.email}`;
                document.getElementById("user-score").textContent = `Score: ${data.score}`;

                document.getElementById("userEmail").value = data.email;
                document.getElementById("userFirstName").value = data.firstname;
                document.getElementById("userScore").value = data.score;

                // Update progress bar
                const score = data.score;
                const progressBar = document.getElementById("progress-bar");
                progressBar.style.width = `${score}%`;
                progressBar.textContent = `${score}%`;
            })
            .catch(error => {
                console.error("Error fetching data:", error);
            });
    </script>
</body>
</html>
